# Pannello contenuti per Pages CMS (https://app.pagescms.org).
# Sara accede con il suo account GitHub e modifica questi contenuti con dei moduli:
# ogni salvataggio aggiorna il sito in circa un minuto.
#
# Testi: una riga vuota = nuovo paragrafo · "### Titolo" = sottotitolo ·
#        *testo* = corsivo · [testo](https://link) = link

media:
  input: images/uploads
  output: images/uploads

components:
  photo:
    type: object
    fields:
      - { name: src, label: Foto, type: image }
      - { name: caption, label: Didascalia (facoltativa), type: string }
      - { name: thumb, label: Miniatura, type: image, hidden: true }
      - { name: w, label: Larghezza, type: number, hidden: true }
      - { name: h, label: Altezza, type: number, hidden: true }
  link:
    type: object
    fields:
      - { name: label, label: Testo del link, type: string }
      - { name: url, label: Indirizzo (https://…), type: string }
  row:
    type: object
    fields:
      - { name: year, label: Anno, type: string }
      - { name: title, label: Titolo, type: string }
      - { name: place, label: Luogo / dettagli, type: string }

content:
  - name: home
    label: Home — foto a rotazione
    type: file
    path: content/home.json
    format: json
    fields:
      - { name: interval_seconds, label: Secondi per ogni foto, type: number }
      - { name: slides, label: Foto della home, component: photo, list: true }

  - name: bio
    label: Bio
    type: file
    path: content/bio.json
    format: json
    fields:
      - { name: portrait, label: Foto profilo, component: photo }
      - { name: biography, label: Biography, type: text }
      - { name: statement, label: Artist statement, type: text }
      - name: facts
        label: Dati in evidenza
        type: object
        list: true
        fields:
          - { name: label, label: Etichetta, type: string }
          - { name: value, label: Valore, type: string }
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - { name: year, label: Anno, type: string }
          - { name: text, label: Descrizione, type: string }
      - name: activities
        label: Activities
        type: object
        list: true
        fields:
          - { name: year, label: Periodo, type: string }
          - { name: text, label: Descrizione, type: string }
      - { name: solo, label: Solo exhibitions, component: row, list: true }
      - { name: group, label: Group exhibitions, component: row, list: true }
      - { name: awards, label: Awards & recognitions, component: row, list: true }
      - { name: languages, label: Languages, type: string }

  - name: projects
    label: Projects
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - { name: id, label: "Identificativo (minuscole senza spazi, es. the-tailors)", type: string, required: true }
      - { name: title, label: Titolo, type: string, required: true }
      - { name: date, label: "Data (es. 2022 oppure Open Project)", type: string }
      - { name: cover, label: Anteprima (copertina), component: photo }
      - { name: endorsement, label: Endorsement (facoltativo, appare in corsivo in testa), type: text }
      - { name: endorsement_author, label: Autore dell'endorsement, type: string }
      - { name: text, label: Sinossi, type: text }
      - { name: side_image, label: Foto accanto alla sinossi (facoltativa), component: photo }
      - { name: images, label: Foto del progetto, component: photo, list: true }

  - name: observations
    label: Observations Photography
    type: file
    path: content/observations.json
    format: json
    fields:
      - { name: title, label: Titolo, type: string }
      - { name: date, label: Data, type: string }
      - { name: cover, label: Anteprima, component: photo }
      - { name: text, label: Sinossi, type: text }
      - { name: images, label: Foto, component: photo, list: true }

  - name: publications
    label: Publications
    type: file
    path: content/publications.json
    format: json
    list: true
    fields:
      - { name: id, label: "Identificativo (minuscole senza spazi)", type: string, required: true }
      - { name: year, label: Anno, type: string }
      - { name: title, label: Titolo, type: string, required: true }
      - { name: subtitle, label: Sottotitolo (facoltativo), type: string }
      - { name: cover, label: Anteprima (copertina), component: photo }
      - { name: endorsement, label: Endorsement (facoltativo), type: text }
      - { name: endorsement_author, label: Autore dell'endorsement, type: string }
      - { name: text, label: Testo, type: text }
      - name: layout
        label: Come mostrare le foto
        type: select
        options:
          values:
            - { value: gallery, label: Miniature quadrate (si aprono in grande) }
            - { value: scroll, label: Foto grandi una sotto l'altra }
      - { name: images, label: Foto, component: photo, list: true }

  - name: news
    label: News
    type: file
    path: content/news.json
    format: json
    list: true
    fields:
      - { name: id, label: "Identificativo (minuscole senza spazi)", type: string, required: true }
      - { name: date, label: "Data per l'ordinamento (AAAA-MM-GG)", type: string }
      - { name: when, label: "Quando, come appare sul sito (es. October 2026)", type: string }
      - { name: title, label: Titolo, type: string, required: true }
      - { name: details, label: "Luogo e date (riga sotto il titolo)", type: string }
      - { name: icon, label: Locandina / immagine dell'elenco, component: photo }
      - { name: text, label: Testo, type: text }
      - name: highlight
        label: In evidenza (facoltativo)
        type: object
        fields:
          - { name: title, label: Titolo, type: string }
          - { name: quote, label: Citazione (facoltativa), type: text }
          - { name: author, label: Autore della citazione, type: string }
          - { name: images, label: Foto, component: photo, list: true }
      - name: video
        label: Video (facoltativo)
        type: object
        fields:
          - { name: title, label: Titolo, type: string }
          - { name: src, label: File video (.mp4), type: file }
          - { name: poster, label: Immagine di anteprima, type: image }
      - name: sections
        label: Sezioni (eventi, presentazioni, festival…)
        type: object
        list: true
        fields:
          - { name: title, label: Titolo, type: string }
          - { name: text, label: Testo, type: text }
          - { name: poster, label: Locandina (facoltativa), component: photo }
          - { name: images, label: Foto, component: photo, list: true }
          - { name: links, label: Link, component: link, list: true }
      - { name: links, label: Articoli e link, component: link, list: true }

  - name: site
    label: Contact
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: email, label: "Email (riceve i messaggi del modulo)", type: string }
      - { name: show_email, label: "Mostrare l'email nella pagina Contact", type: boolean }
      - { name: form_endpoint, label: "Indirizzo del servizio del modulo (lasciare vuoto)", type: string }
      - { name: contact_text, label: Testo della pagina Contact, type: text }
      - { name: contact_photo, label: Foto della pagina Contact, component: photo }
      - { name: facebook, label: Facebook (link), type: string }
      - { name: instagram, label: Instagram (link), type: string }
      - { name: linkedin, label: LinkedIn (link), type: string }
      - { name: x, label: X (link), type: string }
      - { name: behance, label: Behance (link), type: string }
